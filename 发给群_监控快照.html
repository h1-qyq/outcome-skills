:root{
  --navy:#0a1f52;--navy-2:#13306f;--navy-ink:#071538;
  --track:#d8452e;--track-soft:#fbe9e5;
  --timing:#ffd23f;
  --paper:#eef1f6;--surface:#fff;--line:#dfe4ee;--line-2:#c9d1e0;
  --ink:#0f1a33;--ink-2:#46526b;--ink-3:#7a849a;
  --ok:#0e9f6e;
  --cn:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","HarmonyOS Sans","MiSans","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
  --num:"Board","DIN Condensed","Bahnschrift","Barlow Condensed","Roboto Condensed","Arial Narrow",var(--cn);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--navy-ink)}
body{font-family:var(--cn);color:var(--ink);background:var(--paper);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--timing);outline-offset:2px;border-radius:6px}
.num{font-family:var(--num);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}

/* ---------- hero: broadcast package ---------- */
.hero{position:relative;color:#fff;background:var(--navy);overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;
  background:
   radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.10),transparent 55%),
   linear-gradient(180deg,var(--navy) 0%,var(--navy-ink) 100%)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 0;padding-top:max(14px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.78)}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--track);display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:15px;color:#fff;letter-spacing:-.02em}
.brand b{color:#fff;font-weight:600}
.refresh{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fff;font-size:13px;cursor:pointer;transition:background .2s}
.refresh:hover{background:rgba(255,255,255,.14)}
.refresh svg{width:14px;height:14px}
.refresh.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.hero-head{padding:30px 0 22px}
.onair{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--timing);font-weight:600;margin-bottom:14px}
.onair i{width:7px;height:7px;border-radius:50%;background:var(--timing);box-shadow:0 0 0 4px rgba(255,210,63,.18)}
.hero h1{font-size:clamp(34px,9.6vw,72px);line-height:1.04;font-weight:900;letter-spacing:-.02em;max-width:12em}
.hero h1 span{display:block}
.hero-sub{margin-top:14px;font-size:14.5px;color:rgba(255,255,255,.72);max-width:34em}

/* relay lanes */
.lanes{position:relative;margin:6px 0 0;border-top:1px solid rgba(255,255,255,.14)}
.lane{position:relative;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;padding:13px 0;border-bottom:1px dashed rgba(255,255,255,.18)}
.lane:last-child{border-bottom:1px solid rgba(255,255,255,.14)}
.lane-no{font-family:var(--num);font-weight:800;font-size:26px;line-height:1;color:rgba(255,255,255,.35);text-align:center}
.lane-body{min-width:0}
.lane-title{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.lane-title small{font-size:12px;font-weight:400;color:rgba(255,255,255,.55)}
.lane-bar{margin-top:8px;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.lane-bar b{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,rgba(255,255,255,.55),#fff);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.lane.lead .lane-bar b{background:linear-gradient(90deg,#ffb300,var(--timing))}
.lane.lead .lane-no{color:var(--timing)}
.lane-count{font-family:var(--num);font-weight:800;font-size:34px;line-height:1;min-width:2.2ch;text-align:right}
.lane-count small{font-family:var(--cn);font-size:12px;font-weight:500;color:rgba(255,255,255,.55);margin-left:2px}

.scorebar{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:rgba(255,255,255,.12);margin:22px 0 0;border-radius:14px 14px 0 0;overflow:hidden}
.score{background:var(--navy-ink);padding:14px 16px 16px}
.score-v{font-family:var(--num);font-weight:800;font-size:38px;line-height:1;color:#fff}
.score-v.yel{color:var(--timing)}
.score-l{font-size:12.5px;color:rgba(255,255,255,.6);margin-top:6px}
.ticker{display:flex;align-items:center;gap:0;background:var(--track);color:#fff;font-size:13px;height:38px;overflow:hidden}
.ticker-tag{flex:none;height:100%;display:flex;align-items:center;padding:0 12px 0 18px;background:#b8341f;font-weight:700;letter-spacing:.04em}
.ticker-run{flex:1;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.ticker-track{display:inline-flex;white-space:nowrap;gap:28px;padding-left:18px;animation:tick 60s linear infinite}
.ticker-track span b{font-weight:700;margin-right:6px}
@keyframes tick{to{transform:translateX(-50%)}}

/* ---------- sections ---------- */
main{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.sec{padding:30px 0 6px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h2{font-size:21px;font-weight:800;letter-spacing:-.01em}

.fcard{scroll-snap-align:start;position:relative;display:flex;flex-direction:column;min-height:228px;padding:18px 18px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow:hidden}

.fcard.top{background:var(--navy);color:#fff;border-color:var(--navy)}

.f-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.f-org{font-size:30px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.f-title{margin-top:12px;font-size:15px;font-weight:600;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.f-foot{margin-top:auto;padding-top:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.f-meta{font-size:12.5px;color:var(--ink-3)}
.f-stat{font-family:var(--num);font-weight:800;font-size:24px;line-height:1}
.f-stat small{font-family:var(--cn);font-size:12px;font-weight:500;color:var(--ink-3);margin-left:3px}
.f-open{display:inline-flex;align-items:center;height:32px;padding:0 13px;border-radius:999px;background:var(--navy);color:#fff;font-size:13px;font-weight:600;flex:none}

/* platform chip */
.pf{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px 0 7px;border-radius:6px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--pc) 12%,transparent);color:var(--pcd,var(--pc));white-space:nowrap}
.pf::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--pc)}
.fcard.top .pf{background:rgba(255,255,255,.12);color:#fff}

/* toolbar */
.bar{position:sticky;top:0;z-index:20;background:rgba(238,241,246,.92);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);margin-top:22px}
.bar-in{display:flex;flex-direction:column;gap:10px;padding-top:10px;padding-bottom:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#dde3ee;border-radius:12px;padding:3px}
.seg button{height:36px;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button .num{font-size:16px;color:var(--ink-3)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(10,31,82,.12),0 0 0 1px rgba(10,31,82,.04)}
.seg button[aria-pressed=true] .num{color:var(--track)}
.search{position:relative}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line-2);background:#fff;padding:0 12px 0 36px;font-size:15px;outline:none}
.search input:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(19,48,111,.12)}
.search svg{position:absolute;left:12px;top:12px;width:16px;height:16px;color:var(--ink-3)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:#fff;font-size:13px;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip i{width:7px;height:7px;border-radius:2px;background:var(--pc,#99a)}
.chip em{font-style:normal;color:var(--ink-3);font-size:12px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip[aria-pressed=true] em{color:rgba(255,255,255,.6)}

/* era block + results board */
.era{margin-top:26px}
.era-h{display:flex;align-items:center;gap:12px;padding:0 0 12px}
.era-badge{flex:none;height:26px;padding:0 10px;border-radius:7px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;color:#fff;background:var(--track)}
.era.past .era-badge{background:#5b6782}
.era-h h3{font-size:16px;font-weight:700;line-height:1.35}
.era-h p{font-size:12.5px;color:var(--ink-3)}
.board{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.era.past .board{background:#f7f8fb}
.row{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:14px 16px 14px 10px;border-top:1px solid var(--line);position:relative}
.row:first-child{border-top:0}
.row:hover{background:#f6f8fc}
.rk{font-family:var(--num);font-weight:800;font-size:22px;line-height:1.1;color:var(--ink-3);text-align:center;padding-top:1px}
.row.hl .rk{color:var(--track)}
.row.hl::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--track)}
.r-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.r-acc{font-weight:700;font-size:15px}
.r-key{font-size:11.5px;font-weight:700;color:var(--track);background:var(--track-soft);height:20px;padding:0 6px;border-radius:5px;display:inline-flex;align-items:center}
.r-title{margin-top:4px;font-size:14.5px;color:var(--ink-2);word-break:break-word}
.r-foot{margin-top:8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.r-date{white-space:nowrap}
.ms{display:inline-flex;gap:14px;flex-wrap:wrap}.ms:empty{display:none}
.r-link.nolink{font-weight:400;color:var(--ink-3);font-size:12px}
.m{display:inline-flex;align-items:baseline;gap:4px}
.m b{font-family:var(--num);font-weight:800;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.r-link{margin-left:auto;font-weight:600;color:var(--navy-2);font-size:13px;display:inline-flex;align-items:center;gap:4px}
.r-link svg{width:13px;height:13px}
.r-note{margin-top:6px;font-size:12px;color:var(--ink-3)}
/* compact repost row */
.row.rp{padding-top:10px;padding-bottom:10px}
.row.rp .rk{font-size:17px}
.row.rp .r-top{gap:8px}
.row.rp .r-acc{font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:11em}
.row.rp .r-top{flex-wrap:nowrap}.rp-tag{white-space:nowrap}.row.rp .r-time{white-space:nowrap}
.rp-wrap .row,.rp-wrap .row:first-child{border-top:1px solid var(--line)}
.board>.rp-wrap:first-child .row:first-child{border-top:0}
.rp-tag{font-size:12.5px;color:var(--ink-3)}
.row.rp .r-time{margin-left:auto;font-size:12px;color:var(--ink-3)}
.empty{padding:36px 16px;text-align:center;color:var(--ink-3);font-size:14px}

.notes{margin-top:30px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px}

.notes summary::after{content:"展开";font-weight:500;color:var(--ink-3);font-size:13px}
.notes[open] summary::after{content:"收起"}

.notes li{margin:4px 0}
footer{padding:26px 0 0;font-size:12.5px;color:var(--ink-3);text-align:center}

    const hasTime=/T\d/.test(s); const yr = (yr0||p.year!=="2026")?p.year+"年":"";
    return yr+p.month+"月"+p.day+"日"+(hasTime?" "+p.hour+":"+p.minute:""); }
  function sortItems(a){ return a.slice().sort((x,y)=>(y.weight||0)-(x.weight||0)||(y.likes||0)-(x.likes||0)||ts(y.publishedAt)-ts(x.publishedAt)); }
  const isRepost = i => i.source==="repost";
  function leg(i){ if(i.source==="official") return 0; if(CENTRAL.test(i.account||"")) return 1; if(i.source==="media") return 2; return 3; }

  function renderHero(d){
    const now = d.items.filter(i=>i.era==="本期");
    const legs=[0,0,0,0]; now.forEach(i=>legs[leg(i)]++);
    const names=[["第一棒","官号与社团首发"],["第二棒","央媒转发"],["第三棒","省市媒体跟进"],["第四棒","微博转发矩阵"]];
    const max=Math.max(...legs,1), lead=legs.indexOf(max);
    $("#lanes").innerHTML = names.map((n,k)=>`<div class="lane${k===lead?" lead":""}"><div class="lane-no">${k+1}</div><div class="lane-body"><div class="lane-title">${n[0]}<small>${n[1]}</small></div><div class="lane-bar"><b data-w="${Math.max(4,legs[k]/max*100)}"></b></div></div><div class="lane-count">${legs[k]}<small>条</small></div></div>`).join("");
    requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".lane-bar b").forEach(b=>b.style.width=b.dataset.w+"%")));
    const key = now.filter(i=>i.highlight).length;
    const likes = now.reduce((s,i)=>s+(+i.likes||0),0), shares = now.reduce((s,i)=>s+(+i.shares||0),0);
    const pfs = new Set(now.map(i=>i.platform)).size;
    $("#scores").innerHTML = [[now.length,"本期收录",""],[key,"重点媒体","yel"],[fmt(likes)||"0","已核实点赞",""],[fmt(shares)||"0","已核实转发",""]]
      .map(s=>`<div class="score"><div class="score-v ${s[2]}">${s[0]}</div><div class="score-l">${s[1]}${s[1]==="本期收录"?`，覆盖 ${pfs} 个平台`:""}</div></div>`).join("");
    const tk = sortItems(now.filter(i=>i.source!=="official")).slice(0,18).map(i=>`<span><b>${esc(i.account)}</b>${esc(i.platform)}</span>`).join("");
    $("#ticker").innerHTML = tk+tk;
  }

  function renderFeat(d){
    const f = sortItems(d.items.filter(i=>i.era==="本期"&&i.highlight));
    $("#featSec").hidden = !f.length;
    $("#featCount").textContent = f.length+" 家已核实";
    $("#feat").innerHTML = f.map((i,k)=>{
      const st = i.likes!=null?`<div class="f-stat">${fmt(i.likes)}<small>赞</small></div>`:`<div class="f-meta">${esc(fdate(i.publishedAt))}</div>`;
      return `<article class="fcard${k===0?" top":""}" style="${pfv(i.platform)}">
        <div class="f-row"><div class="f-org">${esc(i.account)}</div><span class="pf" style="${pfv(i.platform)}">${esc(i.platform)}</span></div>
        <div class="f-title">${esc(i.title)}</div>
        <div class="f-foot"><div>${st}${i.likes!=null?`<div class="f-meta" style="margin-top:6px">${esc(fdate(i.publishedAt))}</div>`:""}</div>${i.url?`<a class="f-open" href="${esc(i.url)}" target="_blank" rel="noopener">看原帖</a>`:""}</div>
      </article>`;}).join("");
  }

  function match(i){
    if(state.pf!=="全部"&&i.platform!==state.pf) return false;
    const q=state.q.trim().toLowerCase(); if(!q) return true;
    return [i.account,i.title,i.note,i.platform].join(" ").toLowerCase().includes(q);
  }
  const ext = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg>';
  function row(i,r){
    if(isRepost(i)) return `<div class="row rp"><div class="rk">${r}</div><div class="r-body"><div class="r-top"><span class="pf" style="${pfv(i.platform)}">${esc(i.platform)}</span>${i.url?`<a class="r-acc" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.account)}</a>`:`<span class="r-acc">${esc(i.account)}</span>`}<span class="rp-tag">转发话题</span><span class="r-time">${esc(fdate(i.publishedAt).replace(/^\d+月\d+日 /,""))}</span></div></div></div>`;
    const ms=[["赞",i.likes],["转",i.shares],["评",i.comments]].filter(m=>fmt(m[1])!=null).map(m=>`<span class="m"><b>${fmt(m[1])}</b>${m[0]}</span>`).join("");
    return `<div class="row${i.highlight?" hl":""}"><div class="rk">${r}</div><div class="r-body"><div>
      <div class="r-top"><span class="pf" style="${pfv(i.platform)}">${esc(i.platform)}</span><span class="r-acc">${esc(i.account)}</span>${i.highlight?'<span class="r-key">重点</span>':""}</div>
      <div class="r-title">${esc(i.title)}</div>${i.note?`<div class="r-note">${esc(i.note)}</div>`:""}</div>
      <div class="r-foot"><span class="ms">${ms}</span><span class="r-date">${esc(fdate(i.publishedAt,i.era==="往期"))}</span>${i.url?`<a class="r-link" href="${esc(i.url)}" target="_blank" rel="noopener">打开${ext}</a>`:`<span class="r-link nolink">未收录链接</span>`}</div></div></div>`;
  }
  function eraBlock(name,items){
    const d=state.data, desc=(d.eras&&d.eras[name])||"";
    const list=sortItems(items.filter(match));
    let html=""; let buf=[];
    const flush=()=>{ if(buf.length){ html+=`<div class="rp-wrap">${buf.join("")}</div>`; buf=[]; } };
    list.forEach((i,k)=>{ if(isRepost(i)) buf.push(row(i,k+1)); else { flush(); html+=row(i,k+1);} }); flush();
    return `<section class="era${name==="往期"?" past":""}"><div class="era-h"><span class="era-badge">${name}</span><div><h3>${esc(desc.split("·")[0].trim())}</h3><p>${esc(desc.split("·").slice(1).join(" ").trim())}，${list.length} 条${list.length!==items.length?`（共 ${items.length}）`:""}</p></div></div>
      <div class="board">${list.length?html:'<div class="empty">没有符合条件的条目，换个关键词或平台试试。</div>'}</div></section>`;
  }
  function renderChips(){
    const d=state.data; const pool=d.items.filter(i=>state.era==="全部"||i.era===state.era);
    const cnt={}; pool.forEach(i=>cnt[i.platform]=(cnt[i.platform]||0)+1);
    const order=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
    if(state.pf!=="全部"&&!cnt[state.pf]) state.pf="全部";
    $("#chips").innerHTML=[`<button class="chip" type="button" data-pf="全部" aria-pressed="${state.pf==="全部"}">全部平台 <em>${pool.length}</em></button>`]
      .concat(order.map(p=>`<button class="chip" type="button" data-pf="${esc(p)}" style="${pfv(p)}" aria-pressed="${state.pf===p}"><i></i>${esc(p)} <em>${cnt[p]}</em></button>`)).join("");
  }
  function renderList(){
    const d=state.data;
    const now=d.items.filter(i=>i.era==="本期"), past=d.items.filter(i=>i.era==="往期");
    $("#cNow").textContent=now.length; $("#cPast").textContent=past.length; $("#cAll").textContent=d.items.length;
    document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.era===state.era));
    renderChips();
    let h="";
    if(state.era!=="往期") h+=eraBlock("本期",now);
    if(state.era!=="本期") h+=eraBlock("往期",past);
    $("#list").innerHTML=h;
  }
  function apply(d,mode){
    state.data=d;
    $("#updated").textContent=(mode?mode+"，":"")+"数据更新于 "+fdate(d.lastUpdated);
    renderHero(d); renderFeat(d); renderList();
    $("#gaps").innerHTML=(d.gaps||[]).map(g=>`<li>${esc(g)}</li>`).join("")+`<li>本期与往期分开统计，不混算；同一期内按重要程度、点赞、时间排序。</li>`;
  }
  function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("show"),2400); }
  async function load(manual){
    const btn=$("#refresh"); btn.classList.add("spin");
    try{
      if(EMBEDDED && location.protocol==="file:"){ apply(EMBEDDED,"快照版"); if(manual) toast("这是快照版，数据截至 "+fdate(EMBEDDED.lastUpdated)); return; }
      try{
        const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) throw new Error(r.status);
        apply(await r.json(),""); if(manual) toast("已刷新");
      }catch(e){ if(EMBEDDED){ apply(EMBEDDED,"快照版"); if(manual) toast("在线数据读取失败，已显示快照数据"); } else { $("#updated").textContent="数据读取失败，请稍后点刷新重试"; if(manual) toast("读取失败：请检查网络后再点刷新"); } }
    } finally { setTimeout(()=>btn.classList.remove("spin"),400); }
  }
  $("#refresh").addEventListener("click",()=>load(true));
  document.querySelector(".seg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; state.era=b.dataset.era; renderList(); });
  $("#chips").addEventListener("click",e=>{ const b=e.target.closest(".chip"); if(!b) return; state.pf=b.dataset.pf; renderList(); });
  let qt; $("#q").addEventListener("input",e=>{ clearTimeout(qt); qt=setTimeout(()=>{ state.q=e.target.value; renderList(); },120); });
  load(false);
})();
</script>
</body>
</html>
