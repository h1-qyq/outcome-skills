name: Publish free Skill release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7

      - name: Build one archive per Skill
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for skill in outcome-offer proof-pack reply-to-close; do
            archive="dist/${skill}-${GITHUB_REF_NAME}.zip"
            (cd skills && zip -q -r "../${archive}" "${skill}")
          done
          test "$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 3

      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Outcome Skills $GITHUB_REF_NAME" --generate-notes
